services:
  user-service:
    build: ./user-service
    ports:
      - "3000:3000"

  product-service:
    build: ./product-service
    ports:
      - "3001:3001"
  
  order-service:
    build: ./order-service
    ports:
      - "3002:3002"

  gateway-service:
    build: ./gateway-service
    ports:
      - "3003:3003"
    environment:
      USER_SERVICE_URL: http://localhost:3000
      PRODUCT_SERVICE_URL: http://localhost:3001
      ORDER_SERVICE_URL: http://localhost:3002
      GATEWAY_SERVICE_URL: http://localhost:3003
    depends_on:
      - user-service
      - product-service
      - order-service
          